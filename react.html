<!DOCTYPE html>
<html lang="es">

<head>
  <title>DevJobs - Empleos</title>
  <meta charset="UTF-8">
  <meta name="description" content="Busca las mejores ofertas de trabajo para desarrolladores en DevJobs.">

  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./main.js"></script>

  <script type="module">
    import React from "https://esm.sh/react?dev"
    import ReactDOM from "https://esm.sh/react-dom/client?dev"

    const titulo = React.createElement(
      "h1",
      { style: { color: "#09f" } },
      "Hola React"
    )

    function JobCard({ data, titulo, empresa, ubicacion, descripcion }) {
      return (
        <article
          className="result-card"
          data-technology = {data.technology}
          data-location = {data.modalidad}
          data-experience = {data.nivel}
        >
          <h3>{titulo}</h3>
          <h4>{empresa} | {ubicacion}</h4>
          <p>{descripcion}</p>
          <button className="button secondary-button apply-button">Aplicar</button>
        </article>
      )
    }

    const rootEl = document.querySelector('#react-root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(titulo);
  </script>
</head>
